<script>
const CFG = {

let db, ref, set, update, get, remove, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp, off;
let auth = null, AU = {}, authResolve; const authReady = new Promise(r => authResolve = r);
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Snapchat/i.test(navigator.userAgent);
const fbReady = (async () => {
  const A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const D = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  AU = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  ({ ref, set, update, get, remove, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp, off } = D);
  const app = A.initializeApp(CFG);
  db = D.getDatabase(app);
  try { auth = AU.initializeAuth(app, { persistence: [AU.indexedDBLocalPersistence, AU.browserLocalPersistence, AU.inMemoryPersistence], popupRedirectResolver: AU.browserPopupRedirectResolver }); }
  catch (e) { auth = AU.getAuth(app); }
  setTimeout(() => authResolve(auth.currentUser), 4000);
  let first = true;
  AU.onAuthStateChanged(auth, u => { if (first) { first = false; authResolve(u); } });
})();
fbReady.catch(() => {});

// ================= WORLD =================
const T = 40, BLK = 12, RW = 2, NBK = 7, WN = BLK * NBK + RW, WORLD = T * WN, ZS = 400, NZ = Math.ceil(WORLD / ZS);
const isRoad = (gx, gy) => gx % BLK < RW || gy % BLK < RW;
const BP = (bx, by) => ({ x: bx * BLK + 4, y: by * BLK + 4 });
const BUILD = [
  { id: 'belediye', n: 'Belediye', jobs: ['Memur'], c: '#3d5a80', r: '#c0392b', ...BP(3, 3), H: 5 },
  { id: 'market', n: 'Market', jobs: ['Marketçi', 'Kasiyer'], c: '#f5f5f5', r: '#d63a2f', ...BP(2, 2) },
  { id: 'firin', n: 'Fırın', jobs: ['Fırıncı', 'Pastacı'], c: '#e9b872', r: '#9b3b2a', ...BP(4, 2) },
  { id: 'adalet', n: 'Adalet Sarayı', jobs: ['Hakim', 'Savcı', 'Avukat'], c: '#d9cfc1', r: '#5d4037', ...BP(3, 2), H: 4.4 },
  { id: 'hastane', n: 'Hastane', jobs: ['Doktor', 'Hemşire', 'Eczacı', 'Veteriner'], c: '#ffffff', r: '#2e86de', ...BP(4, 3), H: 4.5 },
  { id: 'polis', n: 'Karakol', jobs: ['Polis', 'Asker', 'Jandarma'], c: '#1f3a6b', r: '#111827', ...BP(2, 3) },
  { id: 'okul', n: 'Okul', jobs: ['Öğretmen'], c: '#f4d35e', r: '#8a4b2a', ...BP(2, 4) },
  { id: 'sanayi', n: 'Sanayi', jobs: ['Tamirci', 'Kaportacı', 'Elektrikçi', 'Galerici'], c: '#9aa0a6', r: '#d35400', ...BP(1, 3) },
  { id: 'kuafor', n: 'Güzellik Salonu', jobs: ['Kuaför', 'Berber', 'Manikürcü'], c: '#ffd6e8', r: '#d63384', ...BP(4, 4) },
  { id: 'itfaiye', n: 'İtfaiye', jobs: ['İtfaiyeci'], c: '#c0151f', r: '#7a0d14', ...BP(5, 3) },
  { id: 'cami', n: 'Cami', jobs: ['İmam'], c: '#ecf0f1', r: '#7f8c8d', ...BP(3, 4) },
  { id: 'avm', n: 'KOMŞU AVM', jobs: ['AVM Çalışanı'], c: '#dfe6ee', r: '#6c3483', x: 51, y: 3, w: 8, h: 8, H: 8.2 },
].map(b => Object.assign({ w: 6, h: 6, H: 3.4 }, b));
const BMAP = Object.fromEntries(BUILD.map(b => [b.id, b]));
const ROLES = {
  baskan: { n: 'Belediye Başkanı', b: 'belediye' }, muhtar: { n: 'Muhtar', b: 'belediye' },
  emniyet: { n: 'Emniyet Müdürü', b: 'polis' }, bashekim: { n: 'Başhekim', b: 'hastane' }, okulmuduru: { n: 'Okul Müdürü', b: 'okul' },
};
const STREET = ['Taksici', 'Hırsız', 'Dolandırıcı', 'Şarkıcı', 'Influencer'];
const JOBS = [...new Set(BUILD.flatMap(b => b.jobs))].concat(STREET).sort((a, b) => a.localeCompare(b, 'tr'));
const QUOTA = { Hakim: 2, Savcı: 3, Avukat: 5, İmam: 2 }; const QDEF = 8;
const POLICE = ['Polis', 'Jandarma', 'Asker'];
const ACC = {
  sapka: { n: 'Şapka', p: 200, s: 'h' }, kep: { n: 'Kep', p: 150, s: 'h' }, fiyonk: { n: 'Fiyonk', p: 250, s: 'h' },
  kovboy: { n: 'Kovboy şapkası', p: 800, s: 'h' }, tac: { n: 'Taç 👑', p: 5000, s: 'h' }, gozluk: { n: 'Güneş gözlüğü', p: 300, s: 'e' },
};
const SHOPTYPES = { Market: '🛒', Kafe: '☕', Restoran: '🍔', Butik: '👗' };
// plots: keyed by coordinates
const PLOTS = [];
for (let by = 0; by < NBK; by++) for (let bx = 0; bx < NBK; bx++) {
  const ox = bx * BLK + RW, oy = by * BLK + RW;
  if (BUILD.some(b => b.x < ox + 10 && b.x + b.w > ox && b.y < oy + 10 && b.y + b.h > oy)) continue;
  for (const [dx, dy] of [[1, 1], [6, 1], [1, 6], [6, 6]]) PLOTS.push({ k: (ox + dx) + '_' + (oy + dy), x: ox + dx, y: oy + dy, w: 3, h: 3 });
}
const PMAP = Object.fromEntries(PLOTS.map(p => [p.k, p]));
const HOUSE_PRICE = 1500, SHOP_PRICE = 2500, SHIFT_MS = 45000, SHIFT_PAY = 40, SHIFT_E = 20, REST_MS = 20000;
const JAIL_MS = 90000, WANTED_MS = 90000, DAY_MS = 24 * 60000;
const COURT_DOOR = { x: (BMAP.adalet.x + 3) * T, y: (BMAP.adalet.y + 6) * T + 30 }, JAIL_SPOT = { x: (BMAP.polis.x + 3) * T, y: (BMAP.polis.y + 6) * T + 30 };
const SPAWN = { x: (3 * BLK + 7) * T, y: (4 * BLK + 1) * T };

// ================= STATE =================
const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#ff6fb5', '#34495e'];
let myColor = COLORS[Math.floor(Math.random() * COLORS.length)];
let ME = null, myId = null, myZone = null;
const others = {};               // id -> profile + x,y,tx,ty
let plots = {}, roles = {}, elections = {}, EV = null, cases = {};
let target = null, lastSent = 0, sentX = 0, sentY = 0, task = null;
const cam = { x: WORLD / 2, y: WORLD / 2 };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clean = s => s.replace(/^@+/, '').replace(/[^\p{L}\p{N}._ ]/gu, '').trim().slice(0, 24);
const now = () => Date.now();
const MK = () => new Date().toISOString().slice(0, 7);
const zoneOf = (x, y) => Math.max(0, Math.min(NZ - 1, Math.floor(x / ZS))) + '_' + Math.max(0, Math.min(NZ - 1, Math.floor(y / ZS)));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const toast = (t, ms = 2600) => { const e = document.getElementById('toast'); e.innerHTML = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', ms); };
function sid() {
  try { let v = localStorage.getItem('kk_id'); if (!v) { v = 'p' + Math.random().toString(36).slice(2, 11); localStorage.setItem('kk_id', v); } return v; }
  catch (e) { return 'p' + Math.random().toString(36).slice(2, 11); }
}
function dayPhase() { return (now() % DAY_MS) / DAY_MS; }                  // 0..1, 0 = 06:00
function gameClock() { const m = Math.floor(dayPhase() * 1440 + 360) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function nightK() { const h = (dayPhase() * 24 + 6) % 24; if (h >= 21 || h < 5) return 1; if (h >= 19) return (h - 19) / 2; if (h < 7) return 1 - (h - 5) / 2; return 0; }
const isNight = () => nightK() > 0.5;
function myRole() { for (const r in roles) if (roles[r] && roles[r].id === myId && roles[r].until > now()) return r; return null; }
function roleOf(id) { for (const r in roles) if (roles[r] && roles[r].id === id && roles[r].until > now()) return r; return null; }

// ================= MODAL =================
const modalEl = document.getElementById('modal'), mcard = document.getElementById('mcard');
function modal(title, items, extra = '') {
  mcard.innerHTML = `<h2>${title}</h2>${extra}<div id="mitems"></div><button class="mi" style="justify-content:center;background:#3a4a6b" id="mclose">Kapat</button>`;
  const box = mcard.querySelector('#mitems');
  (items || []).forEach(it => {
    const b = document.createElement('button'); b.className = 'mi'; b.innerHTML = `${it.label}${it.right ? `<span>${it.right}</span>` : ''}`;
    if (it.disabled) b.disabled = true; b.onclick = () => { if (!it.keep) closeModal(); it.fn && it.fn(); }; box.appendChild(b);
  });
  mcard.querySelector('#mclose').onclick = closeModal; modalEl.style.display = 'flex';

function inside(r, x, y, pad = 0) { return x > r.x * T - pad && x < (r.x + r.w) * T + pad && y > r.y * T - pad && y < (r.y + r.h) * T + pad; }
function blocked(x, y) { return BUILD.some(b => inside(b, x, y)) || PLOTS.some(p => plots[p.k] && inside(p, x, y, -12)); }
const nearB = (b, pad = 30) => ME && inside(b, ME.x, ME.y, pad);
const nearPlot = (p, pad = 14) => ME && inside(p, ME.x, ME.y, pad);
function nearOthers(r) { return Object.entries(others).filter(([id, o]) => o.hasPos && o.name && dist(o, ME) < r); }

const actsEl = document.getElementById('acts'); let actsKey = '';
function setActs(list) {
  const key = list.map((a, i) => (a.dyn ? 'D' + i + (a.cls || '') : a.label) + (a.disabled ? 1 : 0)).join('|');
  if (key === actsKey) { [...actsEl.children].forEach((b, i) => { if (list[i] && list[i].dyn && b.textContent !== list[i].label) b.textContent = list[i].label; }); return; }
  actsKey = key; actsEl.innerHTML = '';
  list.forEach(a => { const b = document.createElement('button'); b.textContent = a.label; b.className = a.cls || ''; b.disabled = !!a.disabled; b.onclick = () => a.fn && a.fn(); actsEl.appendChild(b); });
}

  }

    if (b.jobs.includes(ME.job) || roleHere) {

  m.bagM.visible = (p.bag || 0) > now();

// ================= LOOP =================
const adm = { cx: WN / 2, cz: WN / 2, follow: null };
const occ = [], winMats = [];
let prev = performance.now(), lastActs = 0;
let NIGHTC;
function segBox(ax, ay, az, bx, by, bz, e) {
  let t0 = 0, t1 = 1; const d = [bx - ax, by - ay, bz - az], o = [ax, ay, az], lo = [e.x0 - 0.3, 0, e.z0 - 0.3], hi = [e.x1 + 0.3, e.H, e.z1 + 0.3];
  for (let i = 0; i < 3; i++) {
    if (Math.abs(d[i]) < 1e-9) { if (o[i] < lo[i] || o[i] > hi[i]) return false; continue; }
    let a = (lo[i] - o[i]) / d[i], b = (hi[i] - o[i]) / d[i]; if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b); if (t0 > t1) return false;
  }
  return t1 > 0 && t0 < 0.98;
}
function fitView() {
  if (!renderer) return; const c = renderer.domElement, w = c.clientWidth || innerWidth, h = c.clientHeight || innerHeight;
  const sz = renderer.getSize(new THREE.Vector2()); if (sz.x === w && sz.y === h) return;
  renderer.setSize(w, h, false); camera3.aspect = w / h; camera3.updateProjectionMatrix();
}
function frame(t) {
  if ((frame.n = (frame.n || 0) + 1) % 30 === 0) fitView();
  const dt = Math.min(50, t - prev); prev = t;
  let fx = WN / 2, fz = WN / 2;
  if (ME && !(IS_ADMIN && admView)) {
    ME._mv = false;
    if (ME.jail > now()) { target = null; }
    if (ME.ride && others[ME.ride] && others[ME.ride].hasPos) { const d = others[ME.ride]; ME.x = d.x; ME.y = d.y; ME._mv = true; sendPos(); }
    else if (!(ME.jail > now()) && !ME.inside) {
      const [jx, jy, jm] = inputVec();
      if (jm > 0.08) {
        const sp = (ME.job === 'Taksici' ? 0.32 : ME.drive && ME.veh[ME.drive] ? VEH[ME.veh[ME.drive].t].sp : ME.sick ? 0.12 : 0.18) * dt * jm;
        const nx = Math.max(10, Math.min(WORLD - 10, ME.x + jx * sp)), ny = Math.max(10, Math.min(WORLD - 10, ME.y + jy * sp));
        if (!blocked(nx, ny)) { ME.x = nx; ME.y = ny; ME._mv = true; }
        else if (!blocked(nx, ME.y)) { ME.x = nx; ME._mv = true; }
        else if (!blocked(ME.x, ny)) { ME.y = ny; ME._mv = true; }
        ME._face = Math.atan2(jx, jy);

      } else if (ME._wasMv) { ME._wasMv = false; sendPos(true); }
    }
    cam.x += (ME.x - cam.x) * 0.1; cam.y += (ME.y - cam.y) * 0.1;
    fx = cam.x * S3; fz = cam.y * S3;
    if (t - lastActs > 200) { lastActs = t; setActs(computeActs()); }
  } else if (ADMIN && adminOk) {
    if (adm.follow && others[adm.follow] && others[adm.follow].hasPos) { const o = others[adm.follow]; adm.cx += (o.x * S3 - adm.cx) * 0.1; adm.cz += (o.y * S3 - adm.cz) * 0.1; }
    fx = adm.cx; fz = adm.cz;
  } else { const a = t / 9000; fx = WN / 2 + Math.sin(a) * 8; fz = WN / 2 + Math.cos(a) * 8; }
  for (const id in others) { const o = others[id]; if (!o.hasPos) continue; const ox = o.x, oy = o.y; o.x += (o.tx - o.x) * 0.18; o.y += (o.ty - o.y) * 0.18; o._mv = Math.hypot(o.x - ox, o.y - oy) > 0.3; }
  const dist3 = 15 * zoom; camera3.position.set(fx, dist3 * 1.05, fz + dist3 * 0.95); camera3.lookAt(fx, 0.8, fz);
  sun.position.set(fx + 12, 25, fz + 8); sun.target.position.set(fx, 0, fz);
  // day / night
  const nk = nightK();
  hemi.intensity = 1.1 - nk * 0.75; sun.intensity = 1.6 - nk * 1.45;
  scene.background.set('#9fd3ff').lerp(NIGHTC || (NIGHTC = new THREE.Color('#0b1530')), nk); scene.fog.color.copy(scene.background);
  for (const m of winMats) m.emissiveIntensity = nk * 0.9; lampMat.emissiveIntensity = nk * 1.5;
  // buildings between the camera and the player become see-through
  const pp = ME && !(IS_ADMIN && admView) ? [ME.x * S3, ME.y * S3] : null, cp = camera3.position;
  for (const e of occ) {

  for (const id in peopleMesh) if (!peopleMesh[id].seen) { scene.remove(peopleMesh[id].g); if (peopleMesh[id].car) scene.remove(peopleMesh[id].car); peopleMesh[id].label.remove(); delete peopleMesh[id]; }
  for (const k in plotObjs) { const L = plotObjs[k].label; if (L) placeLabel(L, ...L._p); }
  renderEvent(t); waveFlag(t);

}
