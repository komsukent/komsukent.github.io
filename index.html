<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Komşukent</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc06a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
canvas{display:block;touch-action:none;position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;transform-origin:50% 100%;will-change:transform}
.nm{background:rgba(255,255,255,.93);color:#1a1a1a;font:700 12px system-ui;padding:3px 8px;border-radius:10px;display:inline-block}
.nm.me{background:#ffd23f}
.jb{font:600 10px system-ui;color:#fff;text-shadow:0 1px 2px #000;text-align:center}
.bb{background:#fff;color:#222;font:600 13px system-ui;padding:5px 9px;border-radius:10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;text-align:center}
#zoom{position:fixed;right:10px;top:60px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:40px;height:40px;padding:0;border-radius:50%;background:rgba(15,25,45,.85);font-size:20px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:10px;align-items:center;pointer-events:none}
.pill{background:rgba(15,25,45,.85);border-radius:20px;padding:7px 13px;font-weight:700;font-size:14px;pointer-events:auto}
#money{color:#ffd23f}
#online{margin-left:auto}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#log{font-size:13px;line-height:1.35;text-shadow:0 1px 2px #000;max-height:120px;overflow:hidden;pointer-events:none}
#log b{color:#ffd23f}
#bar{display:flex;gap:8px;pointer-events:auto}
#msg{flex:1;border:0;border-radius:22px;padding:11px 15px;font-size:16px;background:rgba(255,255,255,.95);color:#222}
button{border:0;border-radius:22px;padding:11px 16px;font-weight:800;font-size:15px;background:#2aa05a;color:#fff;cursor:pointer}
button:disabled{opacity:.45}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;display:none;background:#e67e22;font-size:17px;padding:13px 22px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#panel{position:fixed;inset:0;background:rgba(10,18,35,.92);display:flex;align-items:center;justify-content:center;z-index:9}
.card{width:min(92vw,420px);background:#15233f;border-radius:22px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h1{margin:0 0 4px;font-size:30px;color:#ffd23f;text-align:center}
.card p{margin:0 0 14px;text-align:center;color:#c9d6f0;font-size:14px}
.card label{display:block;font-size:13px;color:#9fb2d8;margin:12px 0 6px}
.card input,.card select{width:100%;border:0;border-radius:12px;padding:12px;font-size:16px}
#cols{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
#go{width:100%;margin-top:18px;font-size:18px;padding:14px}
#err{color:#ff8a8a;text-align:center;font-size:13px;min-height:18px;margin-top:8px}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(15,25,45,.92);padding:9px 16px;border-radius:18px;font-weight:700;font-size:14px;display:none;z-index:5;text-align:center}
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud"><span class="pill" id="me">…</span><span class="pill" id="money">💰 0</span><span class="pill" id="online">🟢 0</span></div>
<div id="zoom"><button id="zin">＋</button><button id="zout">－</button></div>
<button id="act"></button>
<div id="toast"></div>
<div id="bottom"><div id="log"></div><div id="bar"><input id="msg" maxlength="60" placeholder="Komşulara bir şey yaz…"><button id="send">Gönder</button></div></div>

<div id="panel"><div class="card">
<h1>KOMŞUKENT</h1>
<p>Şehre taşın, meslek seç, para kazan, evini al!</p>
<label>Instagram kullanıcı adın</label>
<input id="name" maxlength="24" placeholder="ör. komsukent" autocomplete="off" autocapitalize="off">
<label>Meslek</label>
<select id="job"></select>
<label>Karakter rengi</label>
<div id="cols"></div>
<button id="go">Şehre gir 🏙️</button>
<div id="err"></div>
</div></div>

<script>
const CFG = {
  apiKey: "AIzaSyAmabB91IL1CUiOJVDHd5KotQ7-egbEWyU",
  authDomain: "komsukent.firebaseapp.com",
  databaseURL: "https://komsukent-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "komsukent",
  storageBucket: "komsukent.firebasestorage.app",
  messagingSenderId: "734007209872",
  appId: "1:734007209872:web:1b379478026d6f73de4d15"
};
let db, ref, set, update, get, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp;
const fbReady = (async () => {
  const A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const D = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  ({ ref, set, update, get, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp } = D);
  db = D.getDatabase(A.initializeApp(CFG));
})();
fbReady.catch(() => {});

// ---------- world
const T = 40, WN = 60, WORLD = T * WN;            // 60x60 tiles
const isRoad = (gx, gy) => gx % 10 === 0 || gy % 10 === 0;
const BUILD = [
  { id: 'belediye', n: 'Belediye', jobs: ['Belediye Başkanı', 'Muhtar', 'Memur'], c: '#3d5a80', r: '#c0392b', x: 22, y: 22, w: 6, h: 6 },
  { id: 'market', n: 'Market', jobs: ['Marketçi', 'Kasiyer'], c: '#f5f5f5', r: '#d63a2f', x: 12, y: 2, w: 6, h: 6 },
  { id: 'firin', n: 'Fırın', jobs: ['Fırıncı', 'Pastacı'], c: '#e9b872', r: '#9b3b2a', x: 32, y: 2, w: 6, h: 6 },
  { id: 'hastane', n: 'Hastane', jobs: ['Doktor', 'Hemşire', 'Eczacı', 'Veteriner'], c: '#ffffff', r: '#2e86de', x: 42, y: 12, w: 6, h: 6 },
  { id: 'polis', n: 'Karakol', jobs: ['Polis', 'Asker', 'Jandarma'], c: '#1f3a6b', r: '#111827', x: 2, y: 12, w: 6, h: 6 },
  { id: 'okul', n: 'Okul', jobs: ['Öğretmen', 'Okul Müdürü'], c: '#f4d35e', r: '#8a4b2a', x: 12, y: 42, w: 6, h: 6 },
  { id: 'sanayi', n: 'Sanayi', jobs: ['Tamirci', 'Kaportacı', 'Elektrikçi', 'Galerici'], c: '#9aa0a6', r: '#d35400', x: 2, y: 32, w: 6, h: 6 },
  { id: 'kuafor', n: 'Güzellik Salonu', jobs: ['Kuaför', 'Berber', 'Manikürcü'], c: '#ffd6e8', r: '#d63384', x: 32, y: 42, w: 6, h: 6 },
  { id: 'itfaiye', n: 'İtfaiye', jobs: ['İtfaiyeci'], c: '#c0151f', r: '#7a0d14', x: 52, y: 32, w: 6, h: 6 },
  { id: 'cami', n: 'Cami', jobs: ['İmam'], c: '#ecf0f1', r: '#7f8c8d', x: 42, y: 2, w: 6, h: 6 },
];
const JOBS = [...new Set(BUILD.flatMap(b => b.jobs))].concat(['Dolandırıcı', 'Hırsız', 'Influencer', 'Şarkıcı']).sort((a, b) => a.localeCompare(b, 'tr'));
const STREET = { 'Dolandırıcı': 1, 'Hırsız': 1, 'Influencer': 1, 'Şarkıcı': 1 };
// house plots: every free 4x4 block area not used by buildings
const PLOTS = [];
for (let by = 0; by < 6; by++) for (let bx = 0; bx < 6; bx++) {
  const ox = bx * 10 + 1, oy = by * 10 + 1;
  if (BUILD.some(b => b.x < ox + 9 && b.x + b.w > ox && b.y < oy + 9 && b.y + b.h > oy)) continue;
  for (const [dx, dy] of [[1, 1], [5, 1], [1, 5], [5, 5]]) PLOTS.push({ x: ox + dx, y: oy + dy, w: 3, h: 3 });
}
const HOUSE_PRICE = 300, WORK_PAY = 15, WORK_CD = 4000;

// ---------- state
const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#ff6fb5', '#34495e'];
let myColor = COLORS[Math.floor(Math.random() * COLORS.length)];
let ME = null, myId = null;
const others = {};         // id -> {x,y,tx,ty,name,color,job,msg,msgT}
let plots = {};             // index -> {id,name}
let target = null, lastSent = 0, lastWork = 0;
const cam = { x: WORLD / 2, y: WORLD / 2 };

function sid() {
  try { let v = localStorage.getItem('kk_id'); if (!v) { v = 'p' + Math.random().toString(36).slice(2, 11); localStorage.setItem('kk_id', v); } return v; }
  catch (e) { return 'p' + Math.random().toString(36).slice(2, 11); }
}
const clean = s => s.replace(/^@+/, '').replace(/[^\p{L}\p{N}._ ]/gu, '').trim().slice(0, 24);
const toast = (t, ms = 2200) => { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', ms); };

// ---------- login UI
const sel = document.getElementById('job');
JOBS.forEach(j => { const o = document.createElement('option'); o.textContent = j; sel.appendChild(o); });
const cols = document.getElementById('cols');
COLORS.forEach(c => { const d = document.createElement('div'); d.className = 'sw' + (c === myColor ? ' on' : ''); d.style.background = c; d.onclick = () => { myColor = c; [...cols.children].forEach(x => x.classList.remove('on')); d.classList.add('on'); }; cols.appendChild(d); });
try { const s = JSON.parse(localStorage.getItem('kk_me') || 'null'); if (s) { document.getElementById('name').value = s.name; sel.value = s.job; myColor = s.color || myColor; } } catch (e) { }

document.getElementById('go').onclick = async () => {
  const name = clean(document.getElementById('name').value);
  if (name.length < 2) { document.getElementById('err').textContent = 'Kullanıcı adını yaz'; return; }
  document.getElementById('go').disabled = true; document.getElementById('err').textContent = 'Şehre bağlanılıyor…';
  try {
    await fbReady;
    myId = sid();
    const snap = await get(ref(db, 'players/' + myId));
    const prev = snap.val() || {};
    ME = { name, job: sel.value, color: myColor, money: prev.money ?? 100, house: prev.house ?? null,
           x: prev.x ?? (WORLD / 2 + (Math.random() - .5) * 200), y: prev.y ?? (WORLD / 2 + 160) };
    try { localStorage.setItem('kk_me', JSON.stringify({ name, job: ME.job, color: myColor })); } catch (e) { }
    await update(ref(db, 'players/' + myId), { name, job: ME.job, color: myColor, money: ME.money, house: ME.house, seen: serverTimestamp() });
    const on = ref(db, 'online/' + myId);
    onDisconnect(on).remove();
    await set(on, { x: Math.round(ME.x), y: Math.round(ME.y), name, color: myColor, job: ME.job, t: serverTimestamp() });
    say(`<b>${esc(name)}</b> şehre taşındı 🏠`, true);
    document.getElementById('panel').style.display = 'none';
    cam.x = ME.x; cam.y = ME.y;
    listen(); hud();
  } catch (e) {
    document.getElementById('go').disabled = false;
    document.getElementById('err').textContent = 'Bağlanamadı: ' + (e.code || e.message);
  }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hud() {
  document.getElementById('me').textContent = '@' + ME.name + ' • ' + ME.job;
  document.getElementById('money').textContent = '💰 ' + ME.money;
  document.getElementById('online').textContent = '🟢 ' + (Object.keys(others).length + 1);
}

// ---------- realtime
function listen() {
  const oref = ref(db, 'online');
  const upd = (s) => {
    if (s.key === myId) return; const v = s.val(); if (!v) return;
    const o = others[s.key] || (others[s.key] = { x: v.x, y: v.y });
    Object.assign(o, { tx: v.x, ty: v.y, name: v.name, color: v.color, job: v.job });
    if (v.msg && v.msgT !== o.msgT) { o.msg = v.msg; o.msgT = v.msgT; o.msgAt = performance.now(); }
    hud();
  };
  onChildAdded(oref, upd); onChildChanged(oref, upd);
  onChildRemoved(oref, s => { delete others[s.key]; hud(); });
  onValue(ref(db, 'plots'), s => { plots = s.val() || {}; refreshPlots(); });
  onChildAdded(query(ref(db, 'log'), limitToLast(6)), s => { const v = s.val(); if (v) addLog(v.h); });
}
function say(html, global) { if (global) push(ref(db, 'log'), { h: html, t: serverTimestamp() }); else addLog(html); }
function addLog(h) { const l = document.getElementById('log'); const d = document.createElement('div'); d.innerHTML = h; l.appendChild(d); while (l.children.length > 6) l.removeChild(l.firstChild); }

function sendPos(force) {
  const now = performance.now();
  if (!force && now - lastSent < 160) return; lastSent = now;
  update(ref(db, 'online/' + myId), { x: Math.round(ME.x), y: Math.round(ME.y) });
}
function saveMe() { update(ref(db, 'players/' + myId), { money: ME.money, house: ME.house, x: Math.round(ME.x), y: Math.round(ME.y) }); }
setInterval(() => { if (ME) saveMe(); }, 15000);

// chat
const msgIn = document.getElementById('msg');
function sendMsg() {
  const t = msgIn.value.trim().slice(0, 60); if (!t || !ME) return; msgIn.value = '';
  ME.msg = t; ME.msgAt = performance.now();
  update(ref(db, 'online/' + myId), { msg: t, msgT: Date.now() });
  say(`<b>${esc(ME.name)}:</b> ${esc(t)}`, true);
}
document.getElementById('send').onclick = sendMsg;
msgIn.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

// ---------- action button (work / buy house)
const act = document.getElementById('act');
let action = null;
act.onclick = () => action && action();
function nearRect(r, pad = 26) {
  const x0 = r.x * T - pad, y0 = r.y * T - pad, x1 = (r.x + r.w) * T + pad, y1 = (r.y + r.h) * T + pad;
  return ME.x > x0 && ME.x < x1 && ME.y > y0 && ME.y < y1;
}
function inside(r, x, y) { return x > r.x * T && x < (r.x + r.w) * T && y > r.y * T && y < (r.y + r.h) * T; }
function blocked(x, y) { return BUILD.some(b => inside(b, x, y)); }
function updateAction() {
  action = null; let label = '';
  const b = BUILD.find(b => nearRect(b));
  const cd = Math.max(0, WORK_CD - (Date.now() - lastWork));
  if (b && b.jobs.includes(ME.job)) {
    label = cd ? `⏳ ${Math.ceil(cd / 1000)} sn` : `🔨 ${b.n}'da çalış (+${WORK_PAY})`;
    if (!cd) action = () => work(b.n);
  } else if (STREET[ME.job] && Object.keys(others).length && !b) {
    label = cd ? `⏳ ${Math.ceil(cd / 1000)} sn` : (ME.job === 'Şarkıcı' || ME.job === 'Influencer' ? '🎤 Sokakta şov yap (+' + WORK_PAY + ')' : '🕶️ İş çevir (+' + WORK_PAY + ')');
    if (!cd) action = () => work('sokak');
  } else if (b) {
    label = `${b.n} • iş: ${b.jobs.join(', ')}`;
  } else {
    const i = PLOTS.findIndex(p => nearRect(p, 10));
    if (i >= 0) {
      const own = plots[i];
      if (!own && ME.house == null) { label = `🏠 Bu arsayı al (${HOUSE_PRICE} 💰)`; action = () => buy(i); }
      else if (own) label = own.id === myId ? '🏡 Senin evin' : `🏡 ${own.name}'in evi`;
      else label = 'Zaten bir evin var 🏡';
    }
  }
  act.style.display = label ? 'block' : 'none'; act.textContent = label; act.disabled = !action;
}
function work(where) {
  lastWork = Date.now(); ME.money += WORK_PAY; hud(); saveMe();
  toast(where === 'sokak' ? (ME.job === 'Dolandırıcı' || ME.job === 'Hırsız' ? '🤫 Kimse görmedi… +' + WORK_PAY : '👏 Alkışlar! +' + WORK_PAY) : '💼 Mesai bitti! +' + WORK_PAY);
}
async function buy(i) {
  if (ME.money < HOUSE_PRICE) { toast(`Para yetmiyor 😅 ${HOUSE_PRICE - ME.money} 💰 daha çalış`); return; }
  const res = await runTransaction(ref(db, 'plots/' + i), cur => cur ? undefined : { id: myId, name: ME.name, color: ME.color });
  if (!res.committed) { toast('Biri senden önce aldı 😬'); return; }
  ME.money -= HOUSE_PRICE; ME.house = i; hud(); saveMe();
  say(`<b>${esc(ME.name)}</b> Komşukent'te ev sahibi oldu 🏡🎉`, true);
}

// ---------- 3D (Three.js)
let THREE = null, renderer, scene, camera3, sun, groundMesh, plotGroup, rayc, ndc;
let zoom = 1;
const S3 = 1 / T;                         // world px -> 3D units (1 unit = 1 tile)
const P3 = (x, y) => [x * S3, y * S3];
const peopleMesh = {};                   // id -> {g, legs:[], label}
const plotObjs = {};                     // index -> {key, obj, label}
const labelsEl = document.getElementById('labels');
const matCache = {};
const mat = (c, o = {}) => { const k = c + JSON.stringify(o); return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c }, o))); };
let boxG;
function box(w, h, d, color, x, y, z, parent, cast = true) {
  const m = new THREE.Mesh(boxG, mat(color)); m.scale.set(w, h, d); m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function signTex(text, bg, fg, w = 512, h = 128) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); let fs = h * 0.55;
  do { g.font = `800 ${fs}px system-ui,sans-serif`; fs -= 2; } while (g.measureText(text).width > w * 0.9 && fs > 10);
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function makeLabel() { const d = document.createElement('div'); d.className = 'lb'; labelsEl.appendChild(d); return d; }
function placeLabel(el, x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(camera3);
  if (v.z > 1 || v.x < -1.3 || v.x > 1.3 || v.y < -1.3 || v.y > 1.3) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const sx = (v.x + 1) / 2 * innerWidth, sy = (1 - v.y) / 2 * innerHeight;
  el.style.transform = `translate(${sx - el.offsetWidth / 2}px,${sy - el.offsetHeight}px)`;
}

async function init3D() {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  boxG = new THREE.BoxGeometry(1, 1, 1);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  scene = new THREE.Scene(); scene.background = new THREE.Color('#9fd3ff'); scene.fog = new THREE.Fog('#9fd3ff', 45, 90);
  camera3 = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 200);
  scene.add(new THREE.HemisphereLight('#ffffff', '#5a7d4a', 1.1));
  sun = new THREE.DirectionalLight('#fff4e0', 1.6); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); const sc = sun.shadow.camera; sc.left = -22; sc.right = 22; sc.top = 22; sc.bottom = -22; sc.near = 1; sc.far = 80;
  sun.shadow.bias = -0.0008; scene.add(sun, sun.target);
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera3.aspect = innerWidth / innerHeight; camera3.updateProjectionMatrix(); });
  rayc = new THREE.Raycaster(); ndc = new THREE.Vector2();

  // ground
  groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(WN + 40, WN + 40), mat('#7cc06a'));
  groundMesh.rotation.x = -Math.PI / 2; groundMesh.position.set(WN / 2, 0, WN / 2); groundMesh.receiveShadow = true; scene.add(groundMesh);
  // roads + sidewalks + dashes
  const dashes = [];
  for (let k = 0; k < WN; k += 10) {
    box(WN, 0.04, 1, '#4a4f57', WN / 2, 0.02, k + 0.5, null, false);
    box(1, 0.045, WN, '#4a4f57', k + 0.5, 0.022, WN / 2, null, false);
    for (let i = 0; i < WN; i += 2) { if (i % 10) { dashes.push([i + 0.5, k + 0.5, 0]); dashes.push([k + 0.5, i + 0.5, 1]); } }
  }
  const dm = new THREE.InstancedMesh(boxG, mat('#eeeeee'), dashes.length), o = new THREE.Object3D();
  dashes.forEach(([x, z, r], i) => { o.position.set(x, 0.05, z); o.scale.set(r ? 0.08 : 0.6, 0.01, r ? 0.6 : 0.08); o.updateMatrix(); dm.setMatrixAt(i, o.matrix); });
  scene.add(dm);
  // buildings
  BUILD.forEach(b => {
    const cxB = b.x + b.w / 2, czB = b.y + b.h / 2, H = b.id === 'belediye' ? 5 : (b.id === 'hastane' ? 4.5 : 3.4);
    box(b.w - 0.2, H, b.h - 0.2, b.c, cxB, H / 2, czB);
    box(b.w + 0.3, 0.45, b.h + 0.3, b.r, cxB, H + 0.22, czB);
    if (b.id === 'cami') {
      const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat('#d4ac0d'));
      dome.position.set(cxB, H + 0.4, czB); dome.castShadow = true; scene.add(dome);
      box(0.5, 6.5, 0.5, '#ecf0f1', b.x + b.w - 0.6, 3.25, b.y + 0.6);
    }
    if (b.id === 'belediye') box(0.08, 2, 0.08, '#ccc', cxB, H + 1.4, czB), box(0.9, 0.55, 0.03, '#e30a17', cxB + 0.48, H + 2.1, czB, null, false);
    const fz = b.y + b.h - 0.08;
    for (let i = 0; i < 4; i++) for (let j = 0; j < Math.floor(H / 1.3); j++) {
      if (j === 0 && (i === 1 || i === 2)) continue;
      box(0.75, 0.7, 0.06, '#6fb6d8', b.x + 0.9 + i * ((b.w - 1.8) / 3), H - 0.9 - j * 1.25, fz + 0.02, null, false);
    }
    box(1.3, 1.9, 0.08, '#5a3d2b', cxB, 0.95, fz + 0.03, null, false);
    box(b.w + 0.2, 0.25, 1.2, b.r, cxB, 2.15, fz + 0.5, null, true);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.05), new THREE.MeshBasicMaterial({ map: signTex(b.n, '#ffffff', '#111111') }));
    sign.position.set(cxB, H - 0.3, fz + 0.09); scene.add(sign);
  });
  // trees (instanced)
  const trees = [];
  for (let gy = 0; gy < WN; gy++) for (let gx = 0; gx < WN; gx++) {
    if (isRoad(gx, gy) || (gx * 7 + gy * 13) % 11) continue;
    if (BUILD.some(b => gx >= b.x - 1 && gx <= b.x + b.w && gy >= b.y - 1 && gy <= b.y + b.h + 1)) continue;
    if (PLOTS.some(p => gx >= p.x - 1 && gx <= p.x + p.w && gy >= p.y - 1 && gy <= p.y + p.h)) continue;
    trees.push([gx + 0.5, gy + 0.5]);
  }
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.15, 1, 6), mat('#6b4423'), trees.length);
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(0.75, 1.9, 7), mat('#2e7d32'), trees.length);
  trees.forEach(([x, z], i) => {
    o.position.set(x, 0.5, z); o.scale.set(1, 1, 1); o.updateMatrix(); trunk.setMatrixAt(i, o.matrix);
    o.position.set(x, 1.85, z); o.updateMatrix(); crown.setMatrixAt(i, o.matrix);
  });
  trunk.castShadow = crown.castShadow = true; scene.add(trunk, crown);
  plotGroup = new THREE.Group(); scene.add(plotGroup);
  refreshPlots();

  // tap to walk
  renderer.domElement.addEventListener('pointerdown', e => {
    if (!ME) return; msgIn.blur();
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    rayc.setFromCamera(ndc, camera3);
    const hit = rayc.intersectObject(groundMesh)[0]; if (!hit) return;
    target = { x: Math.max(10, Math.min(WORLD - 10, hit.point.x * T)), y: Math.max(10, Math.min(WORLD - 10, hit.point.z * T)) };
    tgtMark.position.set(hit.point.x, 0.08, hit.point.z); tgtMark.visible = true;
  });
  tgtMark = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.38, 24), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .85 }));
  tgtMark.rotation.x = -Math.PI / 2; tgtMark.visible = false; scene.add(tgtMark);
  document.getElementById('zin').onclick = () => zoom = Math.max(0.55, zoom - 0.15);
  document.getElementById('zout').onclick = () => zoom = Math.min(1.8, zoom + 0.15);
  requestAnimationFrame(frame);
}
let tgtMark;

const SATILIK_TEX = () => SATILIK_TEX.t || (SATILIK_TEX.t = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#8fcf7c'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.setLineDash([22, 14]); g.strokeRect(10, 10, 236, 236);
  g.fillStyle = '#ffffff'; g.font = '800 44px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SATILIK', 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})());
function refreshPlots() {
  if (!THREE) return;
  PLOTS.forEach((p, i) => {
    const own = plots[i]; const key = own ? own.id + own.color + own.name : '-';
    const cur = plotObjs[i]; if (cur && cur.key === key) return;
    if (cur) { plotGroup.remove(cur.obj); if (cur.label) cur.label.remove(); }
    const g = new THREE.Group(); const cxP = p.x + p.w / 2, czP = p.y + p.h / 2; let label = null;
    if (!own) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.h), new THREE.MeshLambertMaterial({ map: SATILIK_TEX() }));
      m.rotation.x = -Math.PI / 2; m.position.set(cxP, 0.03, czP); m.receiveShadow = true; g.add(m);
    } else {
      box(p.w, 0.06, p.h, '#a8d88f', cxP, 0.03, czP, g, false);
      box(2.4, 1.7, 2.0, '#fbf6ec', cxP, 0.85, czP - 0.1, g);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.9, 1.2, 4), mat(own.color || '#c0392b'));
      roof.rotation.y = Math.PI / 4; roof.position.set(cxP, 2.3, czP - 0.1); roof.castShadow = true; g.add(roof);
      box(0.5, 0.9, 0.05, '#5a3d2b', cxP, 0.45, czP + 0.92, g, false);
      box(0.5, 0.45, 0.05, '#6fb6d8', cxP - 0.75, 1.0, czP + 0.92, g, false);
      box(0.5, 0.45, 0.05, '#6fb6d8', cxP + 0.75, 1.0, czP + 0.92, g, false);
      label = makeLabel(); label.innerHTML = `<span class="nm${own.id === myId ? ' me' : ''}">🏡 ${esc(own.name)}</span>`;
      label._p = [cxP, 3.3, czP];
    }
    plotGroup.add(g); plotObjs[i] = { key, obj: g, label };
  });
}

function personMesh(color) {
  const g = new THREE.Group();
  const legL = box(0.22, 0.6, 0.24, '#2c3e50', -0.14, 0.3, 0, g), legR = box(0.22, 0.6, 0.24, '#2c3e50', 0.14, 0.3, 0, g);
  box(0.62, 0.7, 0.36, color, 0, 0.95, 0, g);
  const armL = box(0.16, 0.6, 0.2, color, -0.4, 0.95, 0, g), armR = box(0.16, 0.6, 0.2, color, 0.4, 0.95, 0, g);
  box(0.46, 0.46, 0.44, '#f2c9a0', 0, 1.55, 0, g);
  box(0.5, 0.16, 0.48, '#3b2a1e', 0, 1.82, -0.02, g);
  box(0.08, 0.08, 0.02, '#222', -0.1, 1.58, 0.225, g, false); box(0.08, 0.08, 0.02, '#222', 0.1, 1.58, 0.225, g, false);
  scene.add(g); return { g, legL, legR, armL, armR, color };
}
function syncPerson(id, p, me, t) {
  let m = peopleMesh[id];
  if (!m || m.color !== p.color) {
    if (m) { scene.remove(m.g); m.label.remove(); }
    m = peopleMesh[id] = personMesh(p.color || '#888'); m.label = makeLabel();
  }
  const [x, z] = P3(p.x, p.y);
  if (p._px !== undefined) { const dx = x - p._px, dz = z - p._pz; if (Math.abs(dx) + Math.abs(dz) > 0.003) m.g.rotation.y = Math.atan2(dx, dz); }
  p._px = x; p._pz = z;
  m.g.position.set(x, 0, z);
  const sw = p._mv ? Math.sin(t / 110) * 0.6 : 0;
  m.legL.rotation.x = sw; m.legR.rotation.x = -sw; m.armL.rotation.x = -sw * 0.8; m.armR.rotation.x = sw * 0.8;
  m.g.position.y = p._mv ? Math.abs(Math.sin(t / 110)) * 0.06 : 0;
  const bub = p.msg && performance.now() - (p.msgAt || 0) < 6000 ? `<div class="bb">${esc(p.msg)}</div>` : '';
  const html = `${bub}<div style="text-align:center"><span class="nm${me ? ' me' : ''}">${me ? '⭐ ' : ''}${esc(p.name || '')}</span></div><div class="jb">${esc(p.job || '')}</div>`;
  if (m.label._h !== html) { m.label.innerHTML = html; m.label._h = html; }
  placeLabel(m.label, x, 2.2, z);
  m.seen = true;
}

// ---------- loop
let prev = performance.now();
function frame(t) {
  const dt = Math.min(50, t - prev); prev = t;
  let fx = WN / 2, fz = WN / 2;
  if (ME) {
    ME._mv = false;
    if (target) {
      const dx = target.x - ME.x, dy = target.y - ME.y, d = Math.hypot(dx, dy), sp = 0.16 * dt;
      if (d < 3) { target = null; tgtMark.visible = false; }
      else {
        const nx = ME.x + dx / d * Math.min(sp, d), ny = ME.y + dy / d * Math.min(sp, d);
        if (!blocked(nx, ny)) { ME.x = nx; ME.y = ny; ME._mv = true; sendPos(); }
        else if (!blocked(nx, ME.y)) { ME.x = nx; ME._mv = true; sendPos(); }
        else if (!blocked(ME.x, ny)) { ME.y = ny; ME._mv = true; sendPos(); }
        else { target = null; tgtMark.visible = false; }
        if (!target) sendPos(true);
      }
    }
    cam.x += (ME.x - cam.x) * 0.1; cam.y += (ME.y - cam.y) * 0.1;
    fx = cam.x * S3; fz = cam.y * S3;
    for (const id in others) { const o = others[id]; const ox = o.x, oy = o.y; o.x += (o.tx - o.x) * 0.18; o.y += (o.ty - o.y) * 0.18; o._mv = Math.hypot(o.x - ox, o.y - oy) > 0.3; }
    updateAction();
  } else { const a = t / 9000; fx = WN / 2 + Math.sin(a) * 8; fz = WN / 2 + Math.cos(a) * 8; }
  // camera: angled like the videos
  const dist = 15 * zoom; camera3.position.set(fx, dist * 1.05, fz + dist * 0.95); camera3.lookAt(fx, 0.8, fz);
  sun.position.set(fx + 12, 25, fz + 8); sun.target.position.set(fx, 0, fz);
  // people
  for (const id in peopleMesh) peopleMesh[id].seen = false;
  if (ME) syncPerson(myId, ME, true, t);
  for (const id in others) syncPerson(id, others[id], false, t);
  for (const id in peopleMesh) if (!peopleMesh[id].seen) { scene.remove(peopleMesh[id].g); peopleMesh[id].label.remove(); delete peopleMesh[id]; }
  for (const i in plotObjs) { const L = plotObjs[i].label; if (L) placeLabel(L, ...L._p); }
  renderer.render(scene, camera3);
  requestAnimationFrame(frame);
}
init3D().catch(e => { document.getElementById('err').textContent = '3D yüklenemedi: ' + e.message; });

</script>
