<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Komşukent">
<meta name="theme-color" content="#15233f">
<title>Komşukent</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc06a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none;position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.nm{background:rgba(255,255,255,.93);color:#1a1a1a;font:700 12px system-ui;padding:3px 8px;border-radius:10px;display:inline-block}
.nm.me{background:#ffd23f}.nm.role{background:#8e44ad;color:#fff}.nm.bad{background:#e74c3c;color:#fff}.nm.jail{background:#555;color:#fff}
.jb{font:600 10px system-ui;color:#fff;text-shadow:0 1px 2px #000;text-align:center}
.bb{background:#fff;color:#222;font:600 13px system-ui;padding:5px 9px;border-radius:10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;margin:0 auto 4px;text-align:center;width:max-content}
.ui{position:fixed;z-index:3}
#hud{top:0;left:0;right:60px;display:flex;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(8px,env(safe-area-inset-left));align-items:center;flex-wrap:wrap;pointer-events:none}
.pill{background:rgba(15,25,45,.85);border-radius:18px;padding:6px 11px;font-weight:700;font-size:13px;pointer-events:auto}
#money{color:#ffd23f}#energy{color:#7CFC9a}
#side{right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
#side button{width:42px;height:42px;padding:0;border-radius:50%;background:rgba(15,25,45,.85);font-size:19px}
#bottom{left:0;right:0;bottom:0;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:none;pointer-events:none;z-index:6}
#bottom.open{display:flex}
#log{position:fixed;z-index:2;left:max(10px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 70px);max-width:min(60vw,420px);font-size:12px;line-height:1.35;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6);pointer-events:none}
#log b{color:#ffd23f}
#bar{display:flex;gap:8px;pointer-events:auto}
#msg{flex:1;border:0;border-radius:22px;padding:11px 15px;font-size:16px;background:rgba(255,255,255,.95);color:#222;-webkit-user-select:text;user-select:text}
button{border:0;border-radius:22px;padding:11px 16px;font-weight:800;font-size:15px;background:#2aa05a;color:#fff;cursor:pointer;font-family:inherit}
button:disabled{opacity:.45}
#acts{right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;align-items:flex-end;max-width:56vw}
#joy{position:fixed;z-index:2;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#joyHint{position:fixed;z-index:2;left:max(26px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.5);display:none;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-align:center;pointer-events:none;text-shadow:0 1px 2px #000}
#acts button{background:#e67e22;font-size:15px;padding:11px 18px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#acts button.blue{background:#2e86de}#acts button.red{background:#c0392b}#acts button.gray{background:rgba(15,25,45,.85);font-weight:700}
#panel,#modal{position:fixed;inset:0;background:rgba(10,18,35,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#modal{display:none;background:rgba(10,18,35,.75)}
.card{width:min(92vw,420px);max-height:86vh;overflow:auto;background:#15233f;border-radius:22px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h1{margin:0 0 4px;font-size:30px;color:#ffd23f;text-align:center}
.card h2{margin:0 0 12px;font-size:20px;color:#ffd23f}
.card p{margin:0 0 12px;color:#c9d6f0;font-size:14px}
.card label{display:block;font-size:13px;color:#9fb2d8;margin:12px 0 6px}
.card input,.card select{width:100%;border:0;border-radius:12px;padding:12px;font-size:16px;-webkit-user-select:text;user-select:text}
.mi{display:flex;width:100%;margin:6px 0;justify-content:space-between;align-items:center;background:#24365e;border-radius:14px;font-weight:700;padding:12px 14px;text-align:left}
.mi span{color:#ffd23f;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
#cols{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
#go{width:100%;margin-top:18px;font-size:18px;padding:14px}
#err{color:#ff8a8a;text-align:center;font-size:13px;min-height:18px;margin-top:8px}
#toast{top:96px;left:50%;transform:translateX(-50%);background:rgba(15,25,45,.94);padding:9px 16px;border-radius:18px;font-weight:700;font-size:14px;display:none;text-align:center;max-width:90vw}
#ann{top:140px;left:50%;transform:translateX(-50%);background:#8e44ad;padding:12px 18px;border-radius:16px;font-weight:800;font-size:16px;display:none;text-align:center;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#admin{top:0;left:0;bottom:0;width:min(300px,82vw);background:rgba(10,18,35,.93);padding:12px;overflow:auto;display:none;z-index:4}
#admin h3{margin:12px 0 6px;color:#ffd23f;font-size:15px}
#admin button{width:100%;margin:3px 0;font-size:14px;padding:9px}
#admin select,#admin input{width:100%;border-radius:10px;border:0;padding:8px;margin:3px 0;font-size:14px}
#admin .pl{display:block;background:#24365e;text-align:left;font-weight:600}
#adminToggle{top:8px;left:8px;display:none;z-index:5;background:rgba(15,25,45,.9);padding:8px 12px}
.rec .ui:not(#adminToggle){display:none!important}
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud" class="ui"><span class="pill" id="me">…</span><span class="pill" id="money">💰 0</span><span class="pill" id="energy">⚡ 100</span><span class="pill" id="clock">🕐</span><span class="pill" id="online">🟢 0</span></div>
<div id="side" class="ui"><button id="bFull">⛶</button><button id="zin">＋</button><button id="zout">－</button><button id="bChat">💬</button><button id="bRank">🏆</button><button id="bWard">👕</button></div>
<div id="joy"><i></i></div><div id="joyHint" class="ui">🕹<br>Sürükle</div>
<div id="acts" class="ui"></div>
<div id="toast" class="ui"></div>
<div id="ann" class="ui"></div>
<div id="log" class="ui"></div>
<div id="bottom" class="ui"><div id="bar"><input id="msg" maxlength="60" placeholder="Komşulara bir şey yaz…"><button id="send">Gönder</button></div></div>
<button id="adminToggle" class="ui">☰ Yönetim</button>
<div id="admin" class="ui"></div>
<div id="modal"><div class="card" id="mcard"></div></div>

<div id="panel"><div class="card" id="login">
<h1>KOMŞUKENT</h1>
<p style="text-align:center">Şehre taşın, meslek seç, para kazan, evini al!</p>
<label>Instagram kullanıcı adın</label>
<input id="name" maxlength="24" placeholder="ör. komsukent" autocomplete="off" autocapitalize="off">
<label>Meslek</label>
<select id="job"></select>
<label>Karakter rengi</label>
<div id="cols"></div>
<button id="go">Şehre gir 🏙️</button>
<div id="err"></div>
</div></div>

<script>
const CFG = {
  apiKey: "AIzaSyAmabB91IL1CUiOJVDHd5KotQ7-egbEWyU",
  authDomain: "komsukent.firebaseapp.com",
  databaseURL: "https://komsukent-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "komsukent",
  storageBucket: "komsukent.firebasestorage.app",
  messagingSenderId: "734007209872",
  appId: "1:734007209872:web:1b379478026d6f73de4d15"
};
const ADMIN_HASH = "11fbedea9816839ca638e3762a73fdc43cd95150747bf7a2a35f74051a61b639";
const ADMIN = location.hash === '#yonetim';
let db, ref, set, update, get, remove, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp, off;
const fbReady = (async () => {
  const A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const D = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  ({ ref, set, update, get, remove, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp, off } = D);
  db = D.getDatabase(A.initializeApp(CFG));
})();
fbReady.catch(() => {});

// ================= WORLD =================
const T = 40, BLK = 12, RW = 2, NBK = 7, WN = BLK * NBK + RW, WORLD = T * WN, ZS = 400, NZ = Math.ceil(WORLD / ZS);
const isRoad = (gx, gy) => gx % BLK < RW || gy % BLK < RW;
const BP = (bx, by) => ({ x: bx * BLK + 4, y: by * BLK + 4 });
const BUILD = [
  { id: 'belediye', n: 'Belediye', jobs: ['Memur'], c: '#3d5a80', r: '#c0392b', ...BP(3, 3), H: 5 },
  { id: 'market', n: 'Market', jobs: ['Marketçi', 'Kasiyer'], c: '#f5f5f5', r: '#d63a2f', ...BP(2, 2) },
  { id: 'firin', n: 'Fırın', jobs: ['Fırıncı', 'Pastacı'], c: '#e9b872', r: '#9b3b2a', ...BP(4, 2) },
  { id: 'adalet', n: 'Adalet Sarayı', jobs: ['Hakim', 'Savcı', 'Avukat'], c: '#d9cfc1', r: '#5d4037', ...BP(3, 2), H: 4.4 },
  { id: 'hastane', n: 'Hastane', jobs: ['Doktor', 'Hemşire', 'Eczacı', 'Veteriner'], c: '#ffffff', r: '#2e86de', ...BP(4, 3), H: 4.5 },
  { id: 'polis', n: 'Karakol', jobs: ['Polis', 'Asker', 'Jandarma'], c: '#1f3a6b', r: '#111827', ...BP(2, 3) },
  { id: 'okul', n: 'Okul', jobs: ['Öğretmen'], c: '#f4d35e', r: '#8a4b2a', ...BP(2, 4) },
  { id: 'sanayi', n: 'Sanayi', jobs: ['Tamirci', 'Kaportacı', 'Elektrikçi', 'Galerici'], c: '#9aa0a6', r: '#d35400', ...BP(1, 3) },
  { id: 'kuafor', n: 'Güzellik Salonu', jobs: ['Kuaför', 'Berber', 'Manikürcü'], c: '#ffd6e8', r: '#d63384', ...BP(4, 4) },
  { id: 'itfaiye', n: 'İtfaiye', jobs: ['İtfaiyeci'], c: '#c0151f', r: '#7a0d14', ...BP(5, 3) },
  { id: 'cami', n: 'Cami', jobs: ['İmam'], c: '#ecf0f1', r: '#7f8c8d', ...BP(3, 4) },
].map(b => Object.assign({ w: 6, h: 6, H: 3.4 }, b));
const BMAP = Object.fromEntries(BUILD.map(b => [b.id, b]));
const ROLES = {
  baskan: { n: 'Belediye Başkanı', b: 'belediye' }, muhtar: { n: 'Muhtar', b: 'belediye' },
  emniyet: { n: 'Emniyet Müdürü', b: 'polis' }, bashekim: { n: 'Başhekim', b: 'hastane' }, okulmuduru: { n: 'Okul Müdürü', b: 'okul' },
};
const STREET = ['Taksici', 'Hırsız', 'Dolandırıcı', 'Şarkıcı', 'Influencer'];
const JOBS = [...new Set(BUILD.flatMap(b => b.jobs))].concat(STREET).sort((a, b) => a.localeCompare(b, 'tr'));
const QUOTA = { Hakim: 2, Savcı: 3, Avukat: 5, İmam: 2 }; const QDEF = 8;
const POLICE = ['Polis', 'Jandarma', 'Asker'];
const ACC = {
  sapka: { n: 'Şapka', p: 200, s: 'h' }, kep: { n: 'Kep', p: 150, s: 'h' }, fiyonk: { n: 'Fiyonk', p: 250, s: 'h' },
  kovboy: { n: 'Kovboy şapkası', p: 800, s: 'h' }, tac: { n: 'Taç 👑', p: 5000, s: 'h' }, gozluk: { n: 'Güneş gözlüğü', p: 300, s: 'e' },
};
const SHOPTYPES = { Market: '🛒', Kafe: '☕', Restoran: '🍔', Butik: '👗' };
// plots: keyed by coordinates
const PLOTS = [];
for (let by = 0; by < NBK; by++) for (let bx = 0; bx < NBK; bx++) {
  const ox = bx * BLK + RW, oy = by * BLK + RW;
  if (BUILD.some(b => b.x < ox + 10 && b.x + b.w > ox && b.y < oy + 10 && b.y + b.h > oy)) continue;
  for (const [dx, dy] of [[1, 1], [6, 1], [1, 6], [6, 6]]) PLOTS.push({ k: (ox + dx) + '_' + (oy + dy), x: ox + dx, y: oy + dy, w: 3, h: 3 });
}
const PMAP = Object.fromEntries(PLOTS.map(p => [p.k, p]));
const HOUSE_PRICE = 1500, SHOP_PRICE = 2500, SHIFT_MS = 45000, SHIFT_PAY = 40, SHIFT_E = 20, REST_MS = 20000;
const JAIL_MS = 90000, WANTED_MS = 90000, DAY_MS = 24 * 60000;
const COURT_DOOR = { x: (BMAP.adalet.x + 3) * T, y: (BMAP.adalet.y + 6) * T + 30 }, JAIL_SPOT = { x: (BMAP.polis.x + 3) * T, y: (BMAP.polis.y + 6) * T + 30 };
const SPAWN = { x: (3 * BLK + 7) * T, y: (4 * BLK + 1) * T };

// ================= STATE =================
const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#ff6fb5', '#34495e'];
let myColor = COLORS[Math.floor(Math.random() * COLORS.length)];
let ME = null, myId = null, myZone = null;
const others = {};               // id -> profile + x,y,tx,ty
let plots = {}, roles = {}, elections = {}, EV = null, cases = {};
let target = null, lastSent = 0, sentX = 0, sentY = 0, task = null;
const cam = { x: WORLD / 2, y: WORLD / 2 };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clean = s => s.replace(/^@+/, '').replace(/[^\p{L}\p{N}._ ]/gu, '').trim().slice(0, 24);
const now = () => Date.now();
const MK = () => new Date().toISOString().slice(0, 7);
const zoneOf = (x, y) => Math.max(0, Math.min(NZ - 1, Math.floor(x / ZS))) + '_' + Math.max(0, Math.min(NZ - 1, Math.floor(y / ZS)));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const toast = (t, ms = 2600) => { const e = document.getElementById('toast'); e.innerHTML = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', ms); };
function sid() {
  try { let v = localStorage.getItem('kk_id'); if (!v) { v = 'p' + Math.random().toString(36).slice(2, 11); localStorage.setItem('kk_id', v); } return v; }
  catch (e) { return 'p' + Math.random().toString(36).slice(2, 11); }
}
function dayPhase() { return (now() % DAY_MS) / DAY_MS; }                  // 0..1, 0 = 06:00
function gameClock() { const m = Math.floor(dayPhase() * 1440 + 360) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function nightK() { const h = (dayPhase() * 24 + 6) % 24; if (h >= 21 || h < 5) return 1; if (h >= 19) return (h - 19) / 2; if (h < 7) return 1 - (h - 5) / 2; return 0; }
const isNight = () => nightK() > 0.5;
function myRole() { for (const r in roles) if (roles[r] && roles[r].id === myId && roles[r].until > now()) return r; return null; }
function roleOf(id) { for (const r in roles) if (roles[r] && roles[r].id === id && roles[r].until > now()) return r; return null; }

// ================= MODAL =================
const modalEl = document.getElementById('modal'), mcard = document.getElementById('mcard');
function modal(title, items, extra = '') {
  mcard.innerHTML = `<h2>${title}</h2>${extra}<div id="mitems"></div><button class="mi" style="justify-content:center;background:#3a4a6b" id="mclose">Kapat</button>`;
  const box = mcard.querySelector('#mitems');
  (items || []).forEach(it => {
    const b = document.createElement('button'); b.className = 'mi'; b.innerHTML = `${it.label}${it.right ? `<span>${it.right}</span>` : ''}`;
    if (it.disabled) b.disabled = true; b.onclick = () => { if (!it.keep) closeModal(); it.fn && it.fn(); }; box.appendChild(b);
  });
  mcard.querySelector('#mclose').onclick = closeModal; modalEl.style.display = 'flex';
}
function closeModal() { modalEl.style.display = 'none'; }
modalEl.addEventListener('pointerdown', e => { if (e.target === modalEl) closeModal(); });

// ================= LOGIN =================
const sel = document.getElementById('job');
JOBS.forEach(j => { const o = document.createElement('option'); o.textContent = j; sel.appendChild(o); });
const cols = document.getElementById('cols');
COLORS.forEach(c => { const d = document.createElement('div'); d.className = 'sw' + (c === myColor ? ' on' : ''); d.style.background = c; d.onclick = () => { myColor = c; [...cols.children].forEach(x => x.classList.remove('on')); d.classList.add('on'); }; cols.appendChild(d); });
try { const s = JSON.parse(localStorage.getItem('kk_me') || 'null'); if (s) { document.getElementById('name').value = s.name; if (JOBS.includes(s.job)) sel.value = s.job; myColor = s.color || myColor; [...cols.children].forEach(x => x.classList.toggle('on', x.style.background && x.style.backgroundColor === hexToRgb(myColor))); } } catch (e) { }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return `rgb(${n >> 16}, ${(n >> 8) & 255}, ${n & 255})`; }
const errEl = document.getElementById('err');

document.getElementById('go').onclick = async () => {
  const name = clean(document.getElementById('name').value);
  if (name.length < 2) { errEl.textContent = 'Kullanıcı adını yaz'; return; }
  document.getElementById('go').disabled = true; errEl.textContent = 'Şehre bağlanılıyor…';
  try {
    await fbReady;
    myId = sid();
    const job = sel.value;
    const on = (await get(ref(db, 'online'))).val() || {};
    const cnt = Object.entries(on).filter(([id, v]) => id !== myId && v && v.job === job).length;
    if (cnt >= (QUOTA[job] || QDEF)) { errEl.textContent = `${job} kadrosu dolu 😬 Başka bir meslek seç`; document.getElementById('go').disabled = false; return; }
    const prev = (await get(ref(db, 'players/' + myId))).val() || {};
    ME = { name, job, color: myColor, money: prev.money ?? 100, energy: prev.energy ?? 100, home: prev.home ?? null, shop: prev.shop ?? null,
      acc: prev.acc || {}, wear: prev.wear || {}, m: prev.m || {},
      x: prev.x ?? (SPAWN.x + (Math.random() - .5) * 200), y: prev.y ?? SPAWN.y, wanted: 0, jail: 0, ride: null };
    if (blocked(ME.x, ME.y) || ME.x > WORLD || ME.y > WORLD || (prev.v || 0) < 3) { ME.x = SPAWN.x + (Math.random() - .5) * 200; ME.y = SPAWN.y; }
    try { localStorage.setItem('kk_me', JSON.stringify({ name, job, color: myColor })); } catch (e) { }
    await update(ref(db, 'players/' + myId), { name, job, color: myColor, money: ME.money, energy: ME.energy, seen: serverTimestamp() });
    const oref = ref(db, 'online/' + myId);
    onDisconnect(oref).remove();
    await set(oref, profile());
    setZone(true);
    say(`<b>${esc(name)}</b> şehre taşındı 🏠 (${esc(job)})`, true);
    document.getElementById('panel').style.display = 'none';
    cam.x = ME.x; cam.y = ME.y;
    listenCommon(); listenPlayer(); hud(); document.getElementById('joyHint').style.display = 'flex';
  } catch (e) {
    document.getElementById('go').disabled = false;
    errEl.textContent = 'Bağlanamadı: ' + (e.code || e.message);
  }
};
function profile() { return { name: ME.name, color: ME.color, job: ME.job, wear: ME.wear || {}, wanted: ME.wanted || 0, jail: ME.jail || 0, ride: ME.ride || null, t: serverTimestamp() }; }

function hud() {
  if (!ME) return;
  const r = myRole();
  document.getElementById('me').textContent = '@' + ME.name + ' • ' + (r ? '👑 ' + ROLES[r].n : ME.job);
  document.getElementById('money').textContent = '💰 ' + Math.floor(ME.money);
  document.getElementById('energy').textContent = '⚡ ' + Math.floor(ME.energy);
  document.getElementById('online').textContent = '🟢 ' + (Object.keys(others).length + 1);
}
setInterval(() => { document.getElementById('clock').textContent = (isNight() ? '🌙 ' : '☀️ ') + gameClock(); }, 1000);

// ================= REALTIME =================
function listenCommon() {
  const oref = ref(db, 'online');
  const upd = s => {
    if (s.key === myId) return; const v = s.val(); if (!v) return;
    const o = others[s.key] || (others[s.key] = {});
    if (v.msg && v.msgT !== o.msgT) o.msgAt = performance.now();
    Object.assign(o, v); hud();
  };
  onChildAdded(oref, upd); onChildChanged(oref, upd);
  onChildRemoved(oref, s => { delete others[s.key]; hud(); });

// ================= LOOP =================
const adm = { cx: WN / 2, cz: WN / 2, follow: null };
const occ = [], winMats = [];
let prev = performance.now(), lastActs = 0;
let NIGHTC;
function frame(t) {
  const dt = Math.min(50, t - prev); prev = t;
  let fx = WN / 2, fz = WN / 2;
  if (ME) {
    ME._mv = false;
    if (ME.jail > now()) { target = null; }
    if (ME.ride && others[ME.ride] && others[ME.ride].hasPos) { const d = others[ME.ride]; ME.x = d.x; ME.y = d.y; ME._mv = true; sendPos(); }
    else if (!(ME.jail > now())) {
      const [jx, jy, jm] = inputVec();
      if (jm > 0.08) {
        const sp = (ME.job === 'Taksici' ? 0.32 : 0.18) * dt * jm;
        const nx = Math.max(10, Math.min(WORLD - 10, ME.x + jx * sp)), ny = Math.max(10, Math.min(WORLD - 10, ME.y + jy * sp));
        if (!blocked(nx, ny)) { ME.x = nx; ME.y = ny; ME._mv = true; }
        else if (!blocked(nx, ME.y)) { ME.x = nx; ME._mv = true; }
        else if (!blocked(ME.x, ny)) { ME.y = ny; ME._mv = true; }
        ME._face = Math.atan2(jx, jy);
        sendPos(); ME._wasMv = true;
      } else if (ME._wasMv) { ME._wasMv = false; sendPos(true); }
    }
    cam.x += (ME.x - cam.x) * 0.1; cam.y += (ME.y - cam.y) * 0.1;
    fx = cam.x * S3; fz = cam.y * S3;
    if (t - lastActs > 200) { lastActs = t; setActs(computeActs()); }
  } else if (ADMIN && adminOk) {
    if (adm.follow && others[adm.follow] && others[adm.follow].hasPos) { const o = others[adm.follow]; adm.cx += (o.x * S3 - adm.cx) * 0.1; adm.cz += (o.y * S3 - adm.cz) * 0.1; }
    fx = adm.cx; fz = adm.cz;
  } else { const a = t / 9000; fx = WN / 2 + Math.sin(a) * 8; fz = WN / 2 + Math.cos(a) * 8; }
  for (const id in others) { const o = others[id]; if (!o.hasPos) continue; const ox = o.x, oy = o.y; o.x += (o.tx - o.x) * 0.18; o.y += (o.ty - o.y) * 0.18; o._mv = Math.hypot(o.x - ox, o.y - oy) > 0.3; }

  for (const m of winMats) m.emissiveIntensity = nk * 0.9; lampMat.emissiveIntensity = nk * 1.5;
  // buildings between the camera and the player become see-through
  const pp = ME ? [ME.x * S3, ME.y * S3] : null;
  for (const e of occ) {
    const hide = pp && pp[0] > e.x0 - 0.6 && pp[0] < e.x1 + 0.6 && pp[1] < e.z1 && pp[1] > e.z0 - e.H * 1.05 - 0.8;
    const a = hide ? 0.28 : 1; if (Math.abs(e.a - a) < 0.01) continue;
